# ============================================================
#  OSBP Field Guide — Application Configuration
#  Sensitive and environment-specific values are sourced from .env / container env
# ============================================================

spring.application.name=osbp-field-guide

# ---- Server Port (Render dynamically sets PORT) ----
server.port=${PORT:8080}

# ---- DataSource ----
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/osbp_db}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:452020}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:osbp-super-secret-key-change-me-in-production-must-be-at-least-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Apache Lucene ----
lucene.index.path=${LUCENE_INDEX_PATH:${user.home}/osbp-lucene-index}

# ---- Multipart (PDF Upload) ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ---- Springdoc / Swagger UI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---- Logging ----
logging.level.com.osbp=INFO
logging.level.org.springframework.security=WARN
